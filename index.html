<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제갈량의 상소문</title><link rel="stylesheet" href="./style.css"></head><body><header><b>제갈량의 상소문</b><span>개인 참모실</span><div id="auth"><input id="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login">로그인</button><button id="signup">가입</button><button id="logout" hidden>로그아웃</button></div></header><main><section class="hero"><div class="art"><span>軍師</span><label>오늘의 한마디</label></div><div class="intro"><small>參謀室</small><h1>오늘의 상소문</h1><p id="date"></p><button id="refresh">오늘 글 확인</button><p id="status">기본 예시 모드</p></div></section><div class="layout"><article><h2>上 疏 文</h2><div id="letter"></div></article><aside><section><h2>제갈량에게 묻기</h2><div id="chat">어서 오시오. 고민을 말하면 사실과 가정을 나누어 함께 살피겠소.</div><textarea id="question" placeholder="질문을 적으세요"></textarea><button id="ask">질문 보내기</button></section><section><h2>참모의 기억</h2><textarea id="notes" placeholder="사업 방향, 결정사항, 고객 인터뷰 메모"></textarea><button id="save">기억 저장</button><small id="saved"></small></section></aside></div></main><footer>로그인과 AI 기능은 배포 설정 후 활성화됩니다.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js"></script></body></html>
